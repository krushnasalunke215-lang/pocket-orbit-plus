name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs npm ci (third-party install scripts), so it only reads
# the repo. Only the deploy job, which runs no project code, may write Pages
# and mint the OIDC token deploy-pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # From Nov 18 2026 `npm ci` fails on the runner (it still passes locally),
      # so for the competition deadline this deploys the prebuilt site/ folder,
      # built locally with `npm run build:pages` and checked with `npm run smoke:pages`.
      # To go back to building here: restore setup-node, `npm ci`, and
      # `npm run build -- --base=/${{ github.event.repository.name }}/` with path dist.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
